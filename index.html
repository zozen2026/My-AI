<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #ffffff;
      color: #0f172a;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid #e2e8f0;
      background: linear-gradient(90deg, #ffffff 0%, #f0f9ff 50%, #fdf4ff 100%);
      gap: 10px;
      flex-wrap: wrap;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }
    .brand {
      font-size: 21px;
      font-weight: 800;
      background: linear-gradient(135deg, #2563eb, #7c3aed, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    select, button, input {
      font-family: inherit;
      font-size: 13px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      padding: 6px 10px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
    }
    button:hover:not(:disabled), select:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.12);
      border-color: #93c5fd;
    }
    button:active:not(:disabled) { transform: translateY(0) scale(0.97); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    #ttsToggleBtn {
      background: linear-gradient(135deg, #ecfeff, #e0f2fe);
      border-color: #7dd3fc;
      color: #0369a1;
      font-weight: 600;
    }
    #stopSpeechBtn {
      background: #fff1f2;
      border-color: #fecdd3;
      color: #be123c;
      font-weight: 600;
    }
    .user-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid #c4b5fd;
      background: linear-gradient(135deg, #f5f3ff, #fdf2f8);
      padding: 4px 11px 4px 6px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }
    .user-badge:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.16);
    }
    .avatar-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #a855f7);
      color: #ffffff;
      display: grid;
      place-items: center;
      font-size: 14px;
      box-shadow: 0 2px 6px rgba(99, 102, 241, 0.35);
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }
    @keyframes popIn {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .msg {
      max-width: 85%;
      padding: 11px 14px;
      border-radius: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      animation: popIn 0.22s ease-out;
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.05);
    }
    .msg.user {
      align-self: flex-start;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: #ffffff;
      border: 1px solid #3b82f6;
    }
    .msg.bot {
      align-self: flex-end;
      background: linear-gradient(135deg, #f8fafc, #f0f9ff);
      border: 1px solid #bae6fd;
      color: #0f172a;
    }
    .msg-actions { display: flex; gap: 6px; margin-top: 7px; }
    .icon-btn {
      padding: 5px 8px;
      line-height: 1;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.45);
      color: #0f172a;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .msg.user .icon-btn {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.35);
      color: #ffffff;
    }
    .msg.user .icon-btn:hover { background: rgba(255, 255, 255, 0.32); }
    .ico {
      width: 15px;
      height: 15px;
      display: block;
    }
    footer {
      border-top: 1px solid #e2e8f0;
      padding: 10px 16px;
      background: linear-gradient(90deg, #ffffff 0%, #f8fafc 100%);
    }
    form {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
    }
    textarea {
      flex: 1;
      resize: none;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 9px 12px;
      font-family: inherit;
      font-size: 14px;
      min-height: 42px;
      max-height: 120px;
      background: #ffffff;
      color: #0f172a;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    textarea:focus, input:focus, select:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.16);
    }
    .send-btn {
      background: linear-gradient(135deg, #2563eb, #ec4899);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      padding: 0 18px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.28);
    }
    .send-btn:hover:not(:disabled) {
      box-shadow: 0 6px 16px rgba(236, 72, 153, 0.32);
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.38);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 18px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 16px 36px rgba(15, 23, 42, 0.16);
      animation: popIn 0.2s ease-out;
    }
    .tabs { display: flex; gap: 6px; }
    .tabs button { flex: 1; }
    .tabs button.active {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #ffffff;
      border-color: transparent;
    }
    .status-msg { font-size: 12.5px; color: #334155; min-height: 18px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">My AI</div>

    <div class="controls">
      <select id="modelSelect" title="اختيار النموذج">
        <option value="llama-3.1-8b-instant">Llama 3.1 8B</option>
        <option value="llama-3.3-70b-versatile">Llama 3.3 70B</option>
        <option value="openai/gpt-oss-20b">GPT-OSS 20B</option>
        <option value="qwen/qwen3-32b">Qwen3 32B</option>
      </select>

      <button type="button" id="ttsToggleBtn" title="تفعيل أو إيقاف نطق الردود">🔊 صوت: تشغيل</button>
      <select id="voiceSelect" title="اختيار الصوت"><option value="">الصوت الافتراضي</option></select>
      <button type="button" id="stopSpeechBtn" title="إيقاف الصوت">⏹ إيقاف</button>

      <div class="user-badge" id="userBadgeBtn" title="الحساب">
        <span class="avatar-circle">👤</span>
        <span id="userLabel" dir="ltr">Guest</span>
      </div>
    </div>
  </header>

  <main id="chat"></main>

  <footer>
    <form id="chatForm">
      <textarea id="promptInput" rows="1" placeholder="اكتب رسالتك..."></textarea>
      <button type="submit" class="send-btn" id="sendBtn">إرسال ✨</button>
    </form>
  </footer>

  <div class="modal-backdrop" id="authModal">
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <strong id="authTitle">الحساب</strong>
        <button type="button" id="closeModalBtn">✕</button>
      </div>

      <div id="loggedOutBox" style="display:flex;flex-direction:column;gap:8px;">
        <div class="tabs">
          <button type="button" id="tabLogin" class="active">تسجيل دخول</button>
          <button type="button" id="tabSignup">إنشاء حساب</button>
        </div>
        <input type="email" id="authEmail" placeholder="البريد الإلكتروني" />
        <input type="password" id="authPassword" placeholder="كلمة المرور (6 أحرف فأكثر)" />
        <button type="button" id="authSubmitBtn" class="send-btn" style="padding:9px;">دخول</button>
      </div>

      <div id="loggedInBox" style="display:none;flex-direction:column;gap:8px;">
        <div id="currentUserEmail" style="font-size:13px;word-break:break-all;"></div>
        <button type="button" id="logoutBtn">تسجيل خروج</button>
      </div>

      <div class="status-msg" id="authStatus"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://lzvtnfdgynwczrkwlwhf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6dnRuZmRneW53Y3pya3dsd2hmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNDIxMTEsImV4cCI6MjEwNDcxODExMX0.w2hNlJ4SszyMBkUVjr1qiWNTTPxHMHkM9YOFtVP-pVI";

    const COPY_SVG = `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
    const CHECK_SVG = `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
    const EDIT_SVG = `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>`;

    const chatEl = document.getElementById("chat");
    const chatForm = document.getElementById("chatForm");
    const promptInput = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");
    const modelSelect = document.getElementById("modelSelect");
    const ttsToggleBtn = document.getElementById("ttsToggleBtn");
    const voiceSelect = document.getElementById("voiceSelect");
    const stopSpeechBtn = document.getElementById("stopSpeechBtn");

    const userBadgeBtn = document.getElementById("userBadgeBtn");
    const userLabel = document.getElementById("userLabel");
    const authModal = document.getElementById("authModal");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const tabLogin = document.getElementById("tabLogin");
    const tabSignup = document.getElementById("tabSignup");
    const authEmail = document.getElementById("authEmail");
    const authPassword = document.getElementById("authPassword");
    const authSubmitBtn = document.getElementById("authSubmitBtn");
    const loggedOutBox = document.getElementById("loggedOutBox");
    const loggedInBox = document.getElementById("loggedInBox");
    const currentUserEmail = document.getElementById("currentUserEmail");
    const logoutBtn = document.getElementById("logoutBtn");
    const authStatus = document.getElementById("authStatus");

    let ttsEnabled = true;
    let voices = [];
    let authMode = "login";
    let session = JSON.parse(localStorage.getItem("my_ai_sb_session") || "null");
    let messagesHistory = [];
    let busy = false;

    function updateUserUI() {
      const user = session?.user;
      if (user?.email) {
        userLabel.textContent = user.email.split("@")[0];
        loggedOutBox.style.display = "none";
        loggedInBox.style.display = "flex";
        currentUserEmail.textContent = "مسجل كـ: " + user.email;
      } else {
        userLabel.textContent = "Guest";
        loggedOutBox.style.display = "flex";
        loggedInBox.style.display = "none";
        currentUserEmail.textContent = "";
      }
    }

    async function sbAuth(endpoint, email, password) {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/${endpoint}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY
        },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, data };
    }

    function loadVoices() {
      if (!("speechSynthesis" in window)) return;
      voices = window.speechSynthesis.getVoices() || [];
      voiceSelect.innerHTML = '<option value="">الصوت الافتراضي</option>';
      voices.forEach((v, idx) => {
        const opt = document.createElement("option");
        opt.value = String(idx);
        opt.textContent = `${v.name} (${v.lang})`;
        voiceSelect.appendChild(opt);
      });
    }

    function speakText(text) {
      if (!ttsEnabled || !("speechSynthesis" in window) || !text) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      const vIdx = parseInt(voiceSelect.value, 10);
      if (!Number.isNaN(vIdx) && voices[vIdx]) {
        utter.voice = voices[vIdx];
        utter.lang = voices[vIdx].lang;
      }
      window.speechSynthesis.speak(utter);
    }

    function renderMessage(role, text) {
      const box = document.createElement("div");
      box.className = `msg ${role}`;

      const body = document.createElement("div");
      body.textContent = text;
      box.appendChild(body);

      const actions = document.createElement("div");
      actions.className = "msg-actions";

      const copyBtn = document.createElement("button");
      copyBtn.type = "button";
      copyBtn.className = "icon-btn";
      copyBtn.innerHTML = COPY_SVG;
      copyBtn.title = "نسخ الرسالة";
      copyBtn.setAttribute("aria-label", "نسخ الرسالة");
      copyBtn.onclick = async () => {
        try {
          await navigator.clipboard.writeText(body.textContent);
          copyBtn.innerHTML = CHECK_SVG;
          setTimeout(() => {
            copyBtn.innerHTML = COPY_SVG;
          }, 1100);
        } catch {}
      };
      actions.appendChild(copyBtn);

      if (role === "user") {
        const editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.className = "icon-btn";
        editBtn.innerHTML = EDIT_SVG;
        editBtn.title = "تعديل الرسالة";
        editBtn.setAttribute("aria-label", "تعديل الرسالة");
        editBtn.onclick = () => {
          if (busy) return;
          const updated = prompt("عدّل رسالتك:", body.textContent);
          if (updated && updated.trim() && updated.trim() !== body.textContent) {
            body.textContent = updated.trim();
            sendPrompt(updated.trim(), true);
          }
        };
        actions.appendChild(editBtn);
      }

      box.appendChild(actions);
      chatEl.appendChild(box);
      chatEl.scrollTop = chatEl.scrollHeight;
      return body;
    }

    async function sendPrompt(text, isEdit = false) {
      if (busy || !text.trim()) return;
      busy = true;
      sendBtn.disabled = true;

      if (!isEdit) {
        renderMessage("user", text);
      }

      messagesHistory.push({ role: "user", content: text });
      messagesHistory = messagesHistory.slice(-2);

      const botBody = renderMessage("bot", "...");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: messagesHistory,
            model: modelSelect.value
          })
        });
        const data = await res.json().catch(() => ({}));
        const reply = data?.choices?.[0]?.message?.content || data?.error || "تعذر الحصول على رد.";
        botBody.textContent = typeof reply === "string" ? reply : JSON.stringify(reply);

        if (res.ok && typeof reply === "string") {
          messagesHistory.push({ role: "assistant", content: reply });
          messagesHistory = messagesHistory.slice(-2);
          speakText(reply);
        }
      } catch {
        botBody.textContent = "خطأ في الاتصال.";
      } finally {
        busy = false;
        sendBtn.disabled = false;
        chatEl.scrollTop = chatEl.scrollHeight;
      }
    }

    userBadgeBtn.onclick = () => { authStatus.textContent = ""; authModal.classList.add("open"); };
    closeModalBtn.onclick = () => authModal.classList.remove("open");
    authModal.onclick = (e) => { if (e.target === authModal) authModal.classList.remove("open"); };

    tabLogin.onclick = () => {
      authMode = "login";
      tabLogin.classList.add("active");
      tabSignup.classList.remove("active");
      authSubmitBtn.textContent = "دخول";
      authStatus.textContent = "";
    };

    tabSignup.onclick = () => {
      authMode = "signup";
      tabSignup.classList.add("active");
      tabLogin.classList.remove("active");
      authSubmitBtn.textContent = "إنشاء حساب";
      authStatus.textContent = "";
    };

    authSubmitBtn.onclick = async () => {
      const email = authEmail.value.trim();
      const password = authPassword.value;
      if (!email || !password) {
        authStatus.textContent = "أدخل البريد الإلكتروني وكلمة المرور.";
        return;
      }
      authStatus.textContent = "جاري التنفيذ...";
      const endpoint = authMode === "login" ? "token?grant_type=password" : "signup";
      const { ok, data } = await sbAuth(endpoint, email, password);

      if (!ok) {
        authStatus.textContent = data?.msg || data?.error_description || "فشلت العملية.";
        return;
      }

      if (data?.access_token) {
        session = data;
        localStorage.setItem("my_ai_sb_session", JSON.stringify(session));
        updateUserUI();
        authStatus.textContent = "تم بنجاح.";
        setTimeout(() => authModal.classList.remove("open"), 500);
      } else {
        authStatus.textContent = "تم إنشاء الحساب. تحقق من بريدك لتأكيده ثم سجّل الدخول.";
      }
    };

    logoutBtn.onclick = () => {
      session = null;
      localStorage.removeItem("my_ai_sb_session");
      updateUserUI();
      authStatus.textContent = "تم تسجيل الخروج.";
    };

    ttsToggleBtn.onclick = () => {
      ttsEnabled = !ttsEnabled;
      ttsToggleBtn.textContent = ttsEnabled ? "🔊 صوت: تشغيل" : "🔇 صوت: إيقاف";
      if (!ttsEnabled && "speechSynthesis" in window) window.speechSynthesis.cancel();
    };

    stopSpeechBtn.onclick = () => {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    };

    chatForm.onsubmit = (e) => {
      e.preventDefault();
      const text = promptInput.value.trim();
      if (!text) return;
      promptInput.value = "";
      sendPrompt(text, false);
    };

    promptInput.onkeydown = (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        chatForm.requestSubmit();
      }
    };

    if ("speechSynthesis" in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    updateUserUI();
    renderMessage("bot", "أهلاً بك في My AI.");
  </script>
</body>
</html>
