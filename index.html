<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My AI</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,sans-serif;background:#fff;color:#0f172a;height:100dvh;display:flex;flex-direction:column}
    header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #e2e8f0;background:linear-gradient(90deg,#fff,#f0f9ff,#fdf4ff);gap:8px;flex-wrap:wrap}
    .brand{font-size:20px;font-weight:800;background:linear-gradient(135deg,#2563eb,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    select,button,input{font-family:inherit;font-size:13px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;color:#0f172a;padding:6px 10px;cursor:pointer}
    .user-box{display:inline-flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:2px 8px;border-radius:12px}
    .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#a855f7);color:#fff;display:grid;place-items:center;font-size:14px}
    .uname{font-size:11px;font-weight:700;color:#334155}
    #chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;max-width:800px;width:100%;margin:0 auto}
    .msg{max-width:84%;padding:10px 13px;border-radius:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
    .msg.user{align-self:flex-start;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff}
    .msg.bot{align-self:flex-end;background:#f0f9ff;border:1px solid #bae6fd}
    .actions{display:flex;gap:5px;margin-top:6px}
    .icon-btn{padding:4px 7px;border-radius:8px;background:rgba(255,255,255,.9);color:#0f172a;display:inline-flex;align-items:center}
    .msg.user .icon-btn{background:rgba(255,255,255,.22);color:#fff;border-color:rgba(255,255,255,.35)}
    .ico{width:14px;height:14px;display:block}
    footer{border-top:1px solid #e2e8f0;padding:10px 14px}
    form{max-width:800px;margin:0 auto;display:flex;gap:8px}
    textarea{flex:1;resize:none;border:1px solid #cbd5e1;border-radius:12px;padding:9px 12px;font-family:inherit;font-size:14px;min-height:42px;max-height:110px}
    .send{background:linear-gradient(135deg,#2563eb,#ec4899);color:#fff;border:none;font-weight:700;padding:0 16px}
    .backdrop{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;align-items:center;justify-content:center;padding:14px;z-index:50}
    .backdrop.open{display:flex}
    .modal{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:8px}
    .tabs{display:flex;gap:6px}
    .tabs button{flex:1}
    .tabs .active{background:#2563eb;color:#fff;border-color:#2563eb}
  </style>
</head>
<body>
  <header>
    <div class="brand">My AI</div>
    <div class="controls">
      <select id="modelSelect">
        <option value="llama-3.1-8b-instant">Llama 3.1 8B</option>
        <option value="llama-3.3-70b-versatile">Llama 3.3 70B</option>
        <option value="openai/gpt-oss-20b">GPT-OSS 20B</option>
        <option value="qwen/qwen3-32b">Qwen3 32B</option>
      </select>
      <button type="button" id="ttsBtn">🔊 صوت</button>
      <select id="voiceSelect"><option value="">صوت افتراضي</option></select>
      <button type="button" id="stopBtn">⏹</button>
      <div class="user-box" id="userBtn">
        <span class="avatar">👤</span>
        <span class="uname" id="userLabel" dir="ltr">Guest</span>
      </div>
    </div>
  </header>

  <main id="chat"></main>

  <footer>
    <form id="chatForm">
      <textarea id="promptInput" rows="1" placeholder="اكتب رسالتك..."></textarea>
      <button type="submit" class="send" id="sendBtn">إرسال</button>
    </form>
  </footer>

  <div class="backdrop" id="authModal">
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <strong>الحساب</strong>
        <button type="button" id="closeModal">✕</button>
      </div>
      <div id="loggedOut" style="display:flex;flex-direction:column;gap:8px">
        <div class="tabs">
          <button type="button" id="tabLogin" class="active">دخول</button>
          <button type="button" id="tabSignup">حساب جديد</button>
        </div>
        <input type="text" id="authName" placeholder="اسم المستخدم" style="display:none" />
        <input type="email" id="authEmail" placeholder="البريد الإلكتروني" />
        <input type="password" id="authPass" placeholder="كلمة المرور" />
        <button type="button" id="authSubmit" class="send" style="padding:8px">تنفيذ</button>
      </div>
      <div id="loggedIn" style="display:none;flex-direction:column;gap:8px">
        <div id="userInfo" style="font-size:13px"></div>
        <button type="button" id="logoutBtn">خروج</button>
      </div>
      <div id="authStatus" style="font-size:12px;color:#334155"></div>
    </div>
  </div>

  <script>
    const SB_URL="https://lzvtnfdgynwczrkwlwhf.supabase.co";
    const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6dnRuZmRneW53Y3pya3dsd2hmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNDIxMTEsImV4cCI6MjEwNDcxODExMX0.w2hNlJ4SszyMBkUVjr1qiWNTTPxHMHkM9YOFtVP-pVI";
    const COPY_ICO=`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
    const CHK_ICO=`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="20 6 9 17 4 12"/></svg>`;
    const EDIT_ICO=`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`;

    const chatEl=document.getElementById("chat"),chatForm=document.getElementById("chatForm"),promptInput=document.getElementById("promptInput"),
      sendBtn=document.getElementById("sendBtn"),modelSelect=document.getElementById("modelSelect"),ttsBtn=document.getElementById("ttsBtn"),
      voiceSelect=document.getElementById("voiceSelect"),stopBtn=document.getElementById("stopBtn"),userBtn=document.getElementById("userBtn"),
      userLabel=document.getElementById("userLabel"),authModal=document.getElementById("authModal"),closeModal=document.getElementById("closeModal"),
      tabLogin=document.getElementById("tabLogin"),tabSignup=document.getElementById("tabSignup"),authName=document.getElementById("authName"),
      authEmail=document.getElementById("authEmail"),authPass=document.getElementById("authPass"),authSubmit=document.getElementById("authSubmit"),
      loggedOut=document.getElementById("loggedOut"),loggedIn=document.getElementById("loggedIn"),userInfo=document.getElementById("userInfo"),
      logoutBtn=document.getElementById("logoutBtn"),authStatus=document.getElementById("authStatus");

    let ttsOn=true,voices=[],mode="login",session=JSON.parse(localStorage.getItem("my_ai_sb")||"null"),history=[],busy=false,activeUserName="Guest";

    async function syncProfile(sess,name=""){
      if(!sess?.user?.id||!sess?.access_token)return null;
      const displayName=(name||sess.user.user_metadata?.display_name||sess.user.email.split("@")[0]).trim();
      try{
        await fetch(`${SB_URL}/rest/v1/profiles?on_conflict=id`,{
          method:"POST",
          headers:{"Content-Type":"application/json","apikey":SB_KEY,"Authorization":`Bearer ${sess.access_token}`,"Prefer":"resolution=merge-duplicates"},
          body:JSON.stringify({id:sess.user.id,email:sess.user.email,display_name:displayName,last_seen_at:new Date().toISOString()})
        });
        const r=await fetch(`${SB_URL}/rest/v1/profiles?id=eq.${encodeURIComponent(sess.user.id)}&select=display_name,email`,{
          headers:{"apikey":SB_KEY,"Authorization":`Bearer ${sess.access_token}`}
        });
        const rows=r.ok?await r.json().catch(()=>[]):[];
        return rows[0]?.display_name||displayName;
      }catch{return displayName;}
    }

    async function refreshUser(){
      if(session?.user?.email){
        activeUserName=await syncProfile(session)||session.user.email.split("@")[0];
        userLabel.textContent=activeUserName;
        loggedOut.style.display="none";loggedIn.style.display="flex";
        userInfo.textContent=`الاسم: ${activeUserName} | ${session.user.email}`;
      }else{
        activeUserName="Guest";
        userLabel.textContent="Guest";
        loggedOut.style.display="flex";loggedIn.style.display="none";
        userInfo.textContent="";
      }
    }

    function loadVoices(){
      if(!("speechSynthesis"in window))return;
      voices=window.speechSynthesis.getVoices()||[];
      voiceSelect.innerHTML='<option value="">صوت افتراضي</option>';
      voices.forEach((v,i)=>{const o=document.createElement("option");o.value=i;o.textContent=`${v.name} (${v.lang})`;voiceSelect.appendChild(o);});
    }

    function speak(t){
      if(!ttsOn||!("speechSynthesis"in window)||!t)return;
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(t);
      const v=voices[parseInt(voiceSelect.value,10)];
      if(v){u.voice=v;u.lang=v.lang;}
      window.speechSynthesis.speak(u);
    }

    function addMsg(role,text){
      const box=document.createElement("div");box.className=`msg ${role}`;
      const body=document.createElement("div");body.textContent=text;box.appendChild(body);
      const act=document.createElement("div");act.className="actions";

      const cBtn=document.createElement("button");cBtn.type="button";cBtn.className="icon-btn";cBtn.innerHTML=COPY_ICO;cBtn.title="نسخ";
      cBtn.onclick=async()=>{try{await navigator.clipboard.writeText(body.textContent);cBtn.innerHTML=CHK_ICO;setTimeout(()=>cBtn.innerHTML=COPY_ICO,1000);}catch{}};
      act.appendChild(cBtn);

      if(role==="user"){
        const eBtn=document.createElement("button");eBtn.type="button";eBtn.className="icon-btn";eBtn.innerHTML=EDIT_ICO;eBtn.title="تعديل";
        eBtn.onclick=()=>{
          if(busy)return;
          const up=prompt("عدّل رسالتك:",body.textContent);
          if(up&&up.trim()&&up.trim()!==body.textContent){body.textContent=up.trim();send(up.trim(),true);}
        };
        act.appendChild(eBtn);
      }

      box.appendChild(act);chatEl.appendChild(box);chatEl.scrollTop=chatEl.scrollHeight;return body;
    }

    async function send(text,isEdit=false){
      if(busy||!text.trim())return;busy=true;sendBtn.disabled=true;
      if(!isEdit)addMsg("user",text);
      history.push({role:"user",content:text});history=history.slice(-2);
      const botBody=addMsg("bot","...");
      try{
        const r=await fetch("/api/chat",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({messages:history,model:modelSelect.value,userName:activeUserName})
        });
        const d=await r.json().catch(()=>({}));
        const rep=d?.choices?.[0]?.message?.content||d?.error||"تعذر الرد.";
        botBody.textContent=typeof rep==="string"?rep:JSON.stringify(rep);
        if(r.ok&&typeof rep==="string"){history.push({role:"assistant",content:rep});history=history.slice(-2);speak(rep);}
      }catch{botBody.textContent="خطأ في الاتصال.";}
      finally{busy=false;sendBtn.disabled=false;chatEl.scrollTop=chatEl.scrollHeight;}
    }

    userBtn.onclick=()=>{authStatus.textContent="";refreshUser();authModal.classList.add("open");};
    closeModal.onclick=()=>authModal.classList.remove("open");
    authModal.onclick=(e)=>{if(e.target===authModal)authModal.classList.remove("open");};
    tabLogin.onclick=()=>{mode="login";tabLogin.classList.add("active");tabSignup.classList.remove("active");authName.style.display="none";authStatus.textContent="";};
    tabSignup.onclick=()=>{mode="signup";tabSignup.classList.add("active");tabLogin.classList.remove("active");authName.style.display="block";authStatus.textContent="";};

    authSubmit.onclick=async()=>{
      const name=authName.value.trim(),email=authEmail.value.trim(),password=authPass.value;
      if(!email||!password){authStatus.textContent="أدخل البريد وكلمة المرور.";return;}
      authStatus.textContent="جاري التنفيذ...";
      const ep=mode==="login"?"token?grant_type=password":"signup";
      const body={email,password};
      if(mode==="signup"&&name)body.data={display_name:name};
      const r=await fetch(`${SB_URL}/auth/v1/${ep}`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SB_KEY},body:JSON.stringify(body)});
      const d=await r.json().catch(()=>({}));
      if(!r.ok){authStatus.textContent=d?.msg||d?.error_description||"فشل الطلب.";return;}
      if(d?.access_token){
        session=d;localStorage.setItem("my_ai_sb",JSON.stringify(session));
        await syncProfile(session,name);await refreshUser();
        authStatus.textContent="تم الحفظ بنجاح.";
        setTimeout(()=>authModal.classList.remove("open"),500);
      }else{
        authStatus.textContent="تم إنشاء الحساب. أكّد بريدك ثم سجل الدخول ليظهر اسمك.";
      }
    };

    logoutBtn.onclick=()=>{session=null;localStorage.removeItem("my_ai_sb");refreshUser();authStatus.textContent="تم الخروج.";};
    ttsBtn.onclick=()=>{ttsOn=!ttsOn;ttsBtn.textContent=ttsOn?"🔊 صوت":"🔇 صامت";if(!ttsOn&&"speechSynthesis"in window)window.speechSynthesis.cancel();};
    stopBtn.onclick=()=>{if("speechSynthesis"in window)window.speechSynthesis.cancel();};
    chatForm.onsubmit=(e)=>{e.preventDefault();const t=promptInput.value.trim();if(!t)return;promptInput.value="";send(t,false);};
    promptInput.onkeydown=(e)=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();chatForm.requestSubmit();}};
    if("speechSynthesis"in window){loadVoices();window.speechSynthesis.onvoiceschanged=loadVoices;}
    refreshUser();addMsg("bot","أهلاً بك في My AI.");
  </script>
</body>
</html>
